<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectGroen - Bestel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ProjectGroen - Bestelling plaatsen</h1>
        
        <!-- Offerte / Quote Section -->
        <section class="offerte-section">
            <h2>Offerte Tool - Gras Diensten</h2>
            <p style="color: #666; margin-bottom: 15px;">Vul uw maten in en selecteer een service om een offerte te krijgen.</p>
            
            <form id="offerteForm">
                <div class="form-group">
                    <label for="gras-lengte">Lengte (in meters):</label>
                    <input type="number" id="gras-lengte" name="gras-lengte" min="0" step="0.1" placeholder="bijv. 10" required>
                </div>
                
                <div class="form-group">
                    <label for="gras-breedte">Breedte (in meters):</label>
                    <input type="number" id="gras-breedte" name="gras-breedte" min="0" step="0.1" placeholder="bijv. 5" required>
                </div>
                
                <div class="form-group">
                    <label for="custom-item">Service:</label>
                    <select id="custom-item" name="custom-item" required>
                        <option value="">-- Selecteer een service --</option>
                        <option value="gras_maaien">Gras maaien</option>
                        <option value="gras_maaien_kanten">Gras maaien + kanten steken</option>
                        <option value="gras_maaien_bemesten">Gras maaien + bemesten</option>
                    </select>
                </div>
                
                <button type="button" id="btn-bereken">Bereken Offerte</button>
            </form>
            
            <!-- Quote Result -->
            <div id="offerte-prijs" class="offerte-result"></div>
        </section>

        <hr style="margin: 30px 0; border: none; border-top: 1px solid #ddd;">
        
        <!-- Order Form Section -->
        <h2>Standaard Pakket Bestelling</h2>
            <div class="form-group">
                <label for="name">Naam:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="address">Adres:</label>
                <input type="text" id="address" name="address" required>
            </div>
            
            <div class="form-group">
                <label for="postal">Postcode / Plaats:</label>
                <input type="text" id="postal" name="postal" required>
            </div>
            
            <div class="form-group">
                <label for="date">Datum:</label>
                <input type="date" id="date" name="date" required>
            </div>
            
            <div class="form-group">
                <label for="time">Tijd:</label>
                <input type="time" id="time" name="time" required>
            </div>
            
            <div class="form-group">
                <label for="packageSelect">Pakket:</label>
                <select id="packageSelect" name="package" required>
                    <option value="">-- Selecteer een pakket --</option>
                </select>
            </div>
            
            <button type="button" id="orderButton">Bestellen</button>
        </form>
        
        <!-- Order summary will be rendered here after clicking Bestellen -->
        <div id="orderSummary" class="order-summary" aria-live="polite" style="margin-top:20px;"></div>
    </div>
    
    <script src="js/functions.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
