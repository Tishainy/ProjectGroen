<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectGroen - Bestel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ProjectGroen - Bestelling plaatsen</h1>
        
        <form id="orderForm">
            <div class="form-group">
                <label for="name">Naam:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="address">Adres:</label>
                <input type="text" id="address" name="address" required>
            </div>
            
            <div class="form-group">
                <label for="postal">Postcode / Plaats:</label>
                <input type="text" id="postal" name="postal" required>
            </div>
            
            <div class="form-group">
                <label for="date">Datum:</label>
                <input type="date" id="date" name="date" required>
            </div>
            
            <div class="form-group">
                <label for="time">Tijd:</label>
                <input type="time" id="time" name="time" required>
            </div>
            
            <div class="form-group">
                <label for="packageSelect">Pakket:</label>
                <select id="packageSelect" name="package" required>
                    <option value="">-- Selecteer een pakket --</option>
                </select>
            </div>
            
            <button type="button" id="orderButton">Bestellen</button>
        </form>
        
        <!-- Order summary will be rendered here after clicking Bestellen -->
        <div id="orderSummary" class="order-summary" aria-live="polite" style="margin-top:20px;"></div>
    </div>
    
    <script src="js/functions.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
